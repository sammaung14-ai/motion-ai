
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar Motion AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#121a30;border-bottom:1px solid #263451}
h1{margin:0;color:#65d9ff;font-size:27px}
header p{color:#aab8d0}
main{max-width:650px;margin:24px auto;padding:16px}
.card{background:#151f36;padding:20px;border-radius:16px;margin-bottom:16px}
label{display:block;margin:14px 0 8px;color:#c9d7ee}
input,textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #344461;background:#0d1629;color:white;font-size:15px}
textarea{min-height:110px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:9px;background:#167bd6;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#344461}
button.active{background:#08a5a5}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
#preview{display:none;max-width:100%;max-height:260px;margin-top:12px;border-radius:10px}
#result{padding:14px;background:#0d1629;border-radius:10px;color:#ffd98a;line-height:1.6}
footer{text-align:center;color:#8492aa;padding:25px}
</style>
</head>
<body>
<header>
<h1>🇲🇲 Myanmar Motion AI</h1>
<p>AI Video Creator · Create Your Imagination</p>
<button id="langBtn" class="secondary" onclick="toggleLang()">English</button>
</header>

<main>
<div class="card">
<h2 id="heading">ဗီဒီယို ဖန်တီးရန်</h2>

<label id="modeLabel">ဖန်တီးမည့်ပုံစံ</label>
<div class="buttons">
<button id="textBtn" class="active" onclick="setMode('text')">Text to Video</button>
<button id="imageBtn" class="secondary" onclick="setMode('image')">Image to Video</button>
</div>

<label id="promptLabel">သင်ဖန်တီးလိုသော ဗီဒီယိုအကြောင်း ရေးပါ</label>
<textarea id="prompt" placeholder="ဥပမာ - မြန်မာ့ကျေးလက်ဒေသမှာ နေထွက်လာတဲ့ ရှုခင်း..."></textarea>

<div id="uploadArea" style="display:none">
<label>ဓာတ်ပုံတင်ရန်</label>
<input type="file" id="imageInput" accept="image/*" onchange="showImage(event)">
<img id="preview" alt="Image preview">
</div>

<label>Video Ratio</label>
<select id="ratio">
<option value="9:16">9:16 · TikTok / Reels</option>
<option value="16:9">16:9 · YouTube</option>
<option value="1:1">1:1 · Square</option>
</select>

<label>Video Quality</label>
<select id="quality">
<option>HD</option>
<option>Full HD</option>
</select>

<label>Duration</label>
<select id="duration">
<option>5 seconds</option>
<option>10 seconds</option>
</select>

<label>Plan</label>
<div class="buttons">
<button id="freeBtn" class="active" onclick="setPlan('Free')">Free</button>
<button id="premiumBtn" class="secondary" onclick="setPlan('Premium')">Premium</button>
</div>

<label>Voice Language</label>
<select id="voice">
<option value="my">Myanmar Voice</option>
<option value="en">English Voice</option>
</select>

<br><br>
<button style="width:100%" onclick="generate()">✨ Generate Video</button>
</div>

<div class="card">
<h2 id="resultTitle">ရလဒ်</h2>
<div id="result">သင့်ဗီဒီယို ဖန်တီးမှုအခြေအနေကို ဒီနေရာမှာ ပြသပါမယ်။</div>
</div>
</main>

<footer>Myanmar Motion AI · Made for Myanmar 🇲🇲</footer>

<script>
let mode='text';
let plan='Free';
let language='my';

function setMode(value){
 mode=value;
 document.getElementById('textBtn').className=value==='text'?'active':'secondary';
 document.getElementById('imageBtn').className=value==='image'?'active':'secondary';
 document.getElementById('uploadArea').style.display=value==='image'?'block':'none';
}

function setPlan(value){
 plan=value;
 document.getElementById('freeBtn').className=value==='Free'?'active':'secondary';
 document.getElementById('premiumBtn').className=value==='Premium'?'active':'secondary';
}

function showImage(event){
 const file=event.target.files[0];
 if(!file)return;
 const preview=document.getElementById('preview');
 preview.src=URL.createObjectURL(file);
 preview.style.display='block';
}

function toggleLang(){
 language=language==='my'?'en':'my';
 document.getElementById('langBtn').textContent=language==='my'?'English':'မြန်မာ';
 document.getElementById('heading').textContent=language==='my'?'ဗီဒီယို ဖန်တီးရန်':'Create Your Video';
 document.getElementById('modeLabel').textContent=language==='my'?'ဖန်တီးမည့်ပုံစံ':'Creation Mode';
 document.getElementById('promptLabel').textContent=language==='my'?'သင်ဖန်တီးလိုသော ဗီဒီယိုအကြောင်း ရေးပါ':'Describe your video';
 document.getElementById('resultTitle').textContent=language==='my'?'ရလဒ်':'Result';
}

function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 const imageFile=document.getElementById('imageInput').files[0];
 const result=document.getElementById('result');

 if(!prompt){
  result.textContent=language==='my'?'ဗီဒီယိုအကြောင်း အရင်ရေးပေးပါ။':'Please enter a video description.';
  return;
 }
 if(mode==='image'&&!imageFile){
  result.textContent=language==='my'?'ဓာတ်ပုံတစ်ပုံ အရင်တင်ပေးပါ။':'Please upload an image first.';
  return;
 }

 result.textContent=language==='my'
 ?'သင့်ရွေးချယ်မှုများ အဆင်သင့်ဖြစ်ပါပြီ။ တကယ်တမ်း AI ဗီဒီယိုထုတ်လုပ်ရန် Video AI API နှင့် Backend ချိတ်ဆက်ရန် လိုအပ်ပါသေးသည်။'
 :'Your settings are ready. A Video AI API and backend connection are still required to generate an actual video.';
}
</script>
</body>
</html>
